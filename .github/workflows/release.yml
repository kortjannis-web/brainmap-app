name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - name: Version aus Tag übernehmen
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          node -e "const f=require('fs'),p='src-tauri/tauri.conf.json',c=JSON.parse(f.readFileSync(p));c.version='$V';f.writeFileSync(p,JSON.stringify(c,null,2))"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Brainmap ${{ github.ref_name }}
          releaseBody: Brainmap-Programm. Installer (.exe) herunterladen. Bestehende Installationen aktualisieren sich beim Start selbst.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
